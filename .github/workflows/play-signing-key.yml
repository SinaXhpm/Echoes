name: Play app signing key

# Once, before the first upload to Google Play: hands Play App Signing the key the GitHub APK is signed with (the
# ANDROID_KEYSTORE_* secrets, as for release.yml), so installs from Play and the APK from GitHub update each other.
# Google's own tool (PEPK) encrypts it with the public key Play Console gives on the app's page: Test and release >
# App integrity > App signing > "Export and upload a key from Java keystore" > "Download encryption public key". Only
# Google can open the result; upload it on that same page. By hand only, from the Actions tab.
# Delete this file once Play shows the key as the app signing key.
on:
  workflow_dispatch:
    inputs:
      encryption_public_key:
        description: "The text of Play Console's encryption_public_key.pem (the BEGIN/END lines may be left out)"
        required: true

permissions:
  contents: read

jobs:
  export:
    # The key is encrypted for whoever's public key the run is given, so only the repository's owner may start it.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: temurin
        java-version: 17

    # The input is only a public key: checked for shape and read with openssl; its fingerprint goes to the log, to
    # compare with the downloaded file.
    - name: Read Google's encryption key
      env:
        INPUT_KEY: ${{ inputs.encryption_public_key }}
      run: |
        set -euo pipefail
        b64=$(printf '%s' "$INPUT_KEY" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \r\n\t')
        if ! printf '%s' "$b64" | grep -Eq '^[A-Za-z0-9+/]{80,}={0,2}$'; then
          echo "::error::That is not the text of a PEM public key."
          exit 1
        fi
        pem="$RUNNER_TEMP/play-encryption-key.pem"
        { echo "-----BEGIN PUBLIC KEY-----"; printf '%s\n' "$b64" | fold -w 64; echo "-----END PUBLIC KEY-----"; } > "$pem"
        # sed reads all of it: an early-closing head could fail the step under pipefail
        openssl pkey -pubin -in "$pem" -noout -text | sed -n 1p
        echo "SHA-256 of the key: $(openssl pkey -pubin -in "$pem" -outform DER | sha256sum | cut -d' ' -f1)"

    # Pinned: a changed tool fails here until its new checksum is reviewed.
    - name: Download PEPK
      env:
        PEPK_SHA256: aaccc0774b240aa5304bdad2a49865e92f229ca73209ecb6eaafe75dc858e24e
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/pepk.jar" \
          https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar
        echo "$PEPK_SHA256  $RUNNER_TEMP/pepk.jar" | sha256sum -c -

    - name: Export the key, encrypted for Google
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The release certificate (public): the GitHub APK carries the same one.
        RELEASE_CERT_SHA256: "47:FA:2F:FD:DF:DC:08:B9:DC:F0:A8:C9:45:90:98:5A:FD:BA:58:34:63:E2:C1:6B:62:AD:82:D6:C1:88:4E:FD"
      run: |
        set -euo pipefail
        missing=()
        [ -z "$ANDROID_KEYSTORE_BASE64" ]   && missing+=("ANDROID_KEYSTORE_BASE64")
        [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
        [ -z "$ANDROID_KEY_ALIAS" ]         && missing+=("ANDROID_KEY_ALIAS")
        [ -z "$ANDROID_KEY_PASSWORD" ]      && missing+=("ANDROID_KEY_PASSWORD")
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::Missing GitHub Secrets for the release key: ${missing[*]}"
          exit 1
        fi
        umask 077
        ks="$RUNNER_TEMP/echoes-release.keystore"
        trap 'rm -f "$ks"' EXIT
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
        cert=$(keytool -list -v -keystore "$ks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS")
        sha=$(grep -m 1 'SHA256: ' <<< "$cert" | sed 's/^.*SHA256: //')
        echo "The key's certificate: $sha"
        if [ "$sha" != "$RELEASE_CERT_SHA256" ]; then
          echo "::error::The keystore's certificate isn't the release certificate."
          exit 1
        fi
        mkdir -p out
        java -jar "$RUNNER_TEMP/pepk.jar" --keystore="$ks" --alias="$ANDROID_KEY_ALIAS" \
          --keystore-pass="$ANDROID_KEYSTORE_PASSWORD" --key-pass="$ANDROID_KEY_PASSWORD" \
          --output=out/echoes-app-signing-key.zip --include-cert \
          --rsa-aes-encryption --encryption-key-path="$RUNNER_TEMP/play-encryption-key.pem"
        unzip -l out/echoes-app-signing-key.zip

    - name: Upload the encrypted key
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: echoes-app-signing-key-for-play
        path: out/*
        retention-days: 1
        if-no-files-found: error
