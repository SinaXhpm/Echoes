name: Package name registration APK

# Once, for Android developer verification (Play Console > Android developer verification > com.sinaxhpm.echoes >
# "Sign and upload an APK"): an APK that only proves we hold the release key. It carries the account's snippet in
# assets/adi-registration.properties and is signed with the key the GitHub APK and the Play bundle use (the
# ANDROID_KEYSTORE_* secrets). No code; it is uploaded on that page and never installed. By hand only.
# Delete this file once the package name shows as registered.
on:
  workflow_dispatch:
    inputs:
      snippet:
        description: "The snippet from the Sign and upload an APK dialog"
        required: true

permissions:
  contents: read

jobs:
  apk:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
    - name: Build the registration APK
      env:
        SNIPPET: ${{ inputs.snippet }}
      run: |
        set -euo pipefail
        if ! printf '%s' "$SNIPPET" | grep -Eq '^[A-Z0-9]{10,64}$'; then
          echo "::error::That doesn't look like the registration snippet."
          exit 1
        fi
        bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
        jar="$ANDROID_HOME/platforms/$(ls "$ANDROID_HOME/platforms" | sort -V | tail -n 1)/android.jar"
        echo "build-tools: $bt"; echo "platform: $jar"
        w="$RUNNER_TEMP/reg"; mkdir -p "$w/assets"
        printf '%s' "$SNIPPET" > "$w/assets/adi-registration.properties"
        cat > "$w/AndroidManifest.xml" <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sinaxhpm.echoes"
            android:versionCode="1" android:versionName="1.0">
          <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="36" />
          <application android:hasCode="false" android:label="Echoes" />
        </manifest>
        EOF
        "$bt/aapt2" link -o "$w/unsigned.apk" --manifest "$w/AndroidManifest.xml" -I "$jar" -A "$w/assets"
        "$bt/zipalign" -p -f 4 "$w/unsigned.apk" "$w/aligned.apk"
        echo "BT=$bt" >> "$GITHUB_ENV"

    - name: Sign it with the release key
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The release certificate (public), without colons, as apksigner prints it.
        RELEASE_CERT_SHA256: 47fa2ffddfdc08b9dcf0a8c94590985afdba583463e2c16b62ad82d6c1884efd
      run: |
        set -euo pipefail
        if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
          echo "::error::Missing GitHub Secrets for the release key (ANDROID_KEYSTORE_*)."
          exit 1
        fi
        umask 077
        ks="$RUNNER_TEMP/echoes-release.keystore"
        trap 'rm -f "$ks"' EXIT
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
        mkdir -p out
        "$BT/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
          --key-pass env:ANDROID_KEY_PASSWORD --out out/echoes-package-registration.apk "$RUNNER_TEMP/reg/aligned.apk"
        certs=$("$BT/apksigner" verify --print-certs out/echoes-package-registration.apk)
        sha=$(grep -m 1 'certificate SHA-256 digest: ' <<< "$certs" | sed 's/^.*digest: //')
        echo "Signed with the certificate $sha"
        if [ "$sha" != "$RELEASE_CERT_SHA256" ]; then
          echo "::error::The APK isn't signed with the release certificate."
          exit 1
        fi
        unzip -l out/echoes-package-registration.apk

    - name: Upload the APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: echoes-package-registration-apk
        path: out/*
        retention-days: 1
        if-no-files-found: error
