name: Android (test build)

# Experimental Android build of the shared Avalonia UI.
# NOTE: most desktop features (curl, ICMP ping, port scanner, SSH, sound) do NOT
# work under Android's sandbox — this only verifies the UI builds and produces an APK.

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'Echoes.Android/**'
      - 'App.axaml'
      - 'App.axaml.cs'
      - 'ViewModels/**'
      - 'Views/**'
      - 'Helpers/**'
      - '.github/workflows/android.yml'

# Least privilege: this job only reads the repo and uploads a workflow artifact.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 10.0.x

    - name: Setup JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android workload
      run: dotnet workload install android

    # EmbedAssembliesIntoApk=true disables Fast Deployment so the Debug APK is a
    # standalone, adb-installable artifact (otherwise managed assemblies are absent
    # and the app aborts with "No assemblies found ... Fast Deployment").
    - name: Build APK (Debug, debug-signed, standalone)
      run: dotnet build Echoes.Android/Echoes.Android.csproj -c Debug -f net10.0-android -p:EmbedAssembliesIntoApk=true

    - name: Upload APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: Echoes-Android-APK
        path: '**/*.apk'
        if-no-files-found: warn
