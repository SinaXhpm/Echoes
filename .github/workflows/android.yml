name: Android (test build)

# Experimental Android build of the shared Avalonia UI.
# NOTE: most desktop features (curl, ICMP ping, port scanner, SSH, sound) do NOT
# work under Android's sandbox — this only verifies the UI builds and produces an APK.

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'Echoes.Android/**'
      - 'App.axaml'
      - 'App.axaml.cs'
      - 'ViewModels/**'
      - 'Views/**'
      - 'Helpers/**'
      - '.github/workflows/android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android workload
      run: dotnet workload install android

    - name: Build APK (Debug, debug-signed)
      run: dotnet build Echoes.Android/Echoes.Android.csproj -c Debug -f net10.0-android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Echoes-Android-APK
        path: '**/*.apk'
        if-no-files-found: warn
