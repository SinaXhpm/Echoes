name: Google Play (bundle)

# Builds the Android App Bundle (.aab) for Google Play and signs it with the release key: the ANDROID_KEYSTORE_* secrets
# release.yml signs the GitHub APK with (certificate SHA-256 47:FA:2F:FD … 4E:FD). Play App Signing holds that same key,
# so an install from Play and the APK from GitHub (both com.sinaxhpm.echoes) update each other, and Play takes it as the
# upload key too. By hand only (Actions tab, or `gh workflow run play.yml`). Nothing is published: the signed bundle is a
# workflow artifact, uploaded in Play Console.
#
# A store build (-p:StoreBuild=true, the STORE constant): no update check against GitHub and no Releases link, since
# Play's rules allow updates only through Play. The version name and code come from Echoes.Android.csproj
# (ApplicationDisplayVersion, ApplicationVersion); Play refuses a version code it has had before.
on:
  workflow_dispatch:

# Least privilege: this job only reads the repo and uploads a workflow artifact.
permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      # The release certificate (public): the GitHub APK carries the same one.
      RELEASE_CERT_SHA256: "47:FA:2F:FD:DF:DC:08:B9:DC:F0:A8:C9:45:90:98:5A:FD:BA:58:34:63:E2:C1:6B:62:AD:82:D6:C1:88:4E:FD"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 10.0.x

    - name: Setup JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android workload
      run: dotnet workload install android

    # Reads the bundle's manifest below. Pinned: a changed file fails here until its new checksum is reviewed.
    - name: Download bundletool
      env:
        BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
      run: |
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" \
          https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
        echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -

    - name: Decode release keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        umask 077
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/echoes-release.keystore"
        if [ ! -s "$RUNNER_TEMP/echoes-release.keystore" ]; then
          echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
          exit 1
        fi

    # As in release.yml: the signing passwords go through env (MSBuild imports env vars as properties), not -p: on the
    # command line, so they never land in argv / a binlog.
    - name: Build the App Bundle (Release, store build, signed)
      env:
        AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        AndroidSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
        AndroidSigningKeyPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: >
        dotnet build Echoes.Android/Echoes.Android.csproj -c Release -f net10.0-android
        -p:AndroidPackageFormat=aab -p:StoreBuild=true
        -p:AndroidKeyStore=true
        -p:AndroidSigningKeyStore="$RUNNER_TEMP/echoes-release.keystore"

    - name: Remove the keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/echoes-release.keystore"

    # What Play checks on upload, checked here first: the signature and its certificate, the package, targetSdk 36
    # (Play's minimum for new apps and updates since 2026-08-31) and 16 KB page alignment of the 64-bit native libraries.
    - name: Check and collect the bundle
      run: |
        set -euo pipefail
        mapfile -t found < <(find Echoes.Android/bin -type f -name "*-Signed.aab")
        if [ "${#found[@]}" -ne 1 ]; then
          echo "::error::Expected one signed bundle, found ${#found[@]}: ${found[*]}"
          exit 1
        fi
        aab="${found[0]}"
        jarsigner -verify "$aab" > "$RUNNER_TEMP/verify.txt"
        grep -q "jar verified" "$RUNNER_TEMP/verify.txt" || { cat "$RUNNER_TEMP/verify.txt"; exit 1; }
        cert=$(keytool -printcert -jarfile "$aab")
        sha=$(grep -m 1 'SHA256: ' <<< "$cert" | sed 's/^.*SHA256: //')
        echo "Signed with the certificate $sha"
        if [ "$sha" != "$RELEASE_CERT_SHA256" ]; then
          echo "::error::The bundle isn't signed with the release certificate."
          exit 1
        fi
        bt() { java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle "$aab" --xpath "$1"; }
        pkg=$(bt /manifest/@package)
        code=$(bt /manifest/@android:versionCode)
        name=$(bt /manifest/@android:versionName)
        target=$(bt /manifest/uses-sdk/@android:targetSdkVersion)
        echo "$pkg $name (version code $code), targetSdk $target"
        if [ "$pkg" != "com.sinaxhpm.echoes" ]; then echo "::error::Unexpected package $pkg"; exit 1; fi
        if [ "$target" -lt 36 ]; then echo "::error::Google Play needs targetSdk 36 or higher."; exit 1; fi
        if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::Unexpected version $name"; exit 1; fi
        rm -rf "$RUNNER_TEMP/libs"
        unzip -q "$aab" 'base/lib/*' -d "$RUNNER_TEMP/libs"
        python3 - "$RUNNER_TEMP/libs/base/lib" <<'EOF'
        import os, struct, sys
        root, bad, seen = sys.argv[1], [], 0
        for abi in sorted(os.listdir(root)):
            for name in sorted(os.listdir(os.path.join(root, abi))):
                data = open(os.path.join(root, abi, name), "rb").read()
                if data[:4] != b"\x7fELF" or data[4] != 2:
                    continue  # 16 KB pages exist on 64-bit devices only
                seen += 1
                phoff, = struct.unpack_from("<Q", data, 0x20)
                size, count = struct.unpack_from("<HH", data, 0x36)
                aligns = [struct.unpack_from("<Q", data, phoff + i * size + 0x30)[0]
                          for i in range(count) if struct.unpack_from("<I", data, phoff + i * size)[0] == 1]
                if min(aligns, default=0) < 0x4000:
                    bad.append(f"{abi}/{name}: LOAD align {min(aligns, default=0):#x}")
        print(f"{seen} 64-bit native libraries checked for 16 KB alignment")
        if bad or not seen:
            print("::error::Not aligned to 16 KB: " + ", ".join(bad or ["no 64-bit library found"]))
            sys.exit(1)
        EOF
        mkdir -p out
        cp "$aab" "out/Echoes-${name}-${code}-play.aab"
        ls -la out

    - name: Upload the signed bundle
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: Echoes-Play
        path: out/*.aab
        if-no-files-found: error
