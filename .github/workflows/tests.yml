name: Tests

# The tests of the shared helpers (Echoes.Tests) on the systems the desktop app is released for. Most of them are plain
# logic (packet decoding, the capture filter, capture files, reply parsers) and give the same result everywhere. The
# "live" ones use real sockets on the runner's own loopback interface, because the code they test is different on every
# system: choosing the interface a socket sends from, ICMP, packet capture, the neighbor table.
#
# Each system runs them three times:
#   1. as the runner's ordinary user, on .NET 8 (the desktop app's runtime);
#   2. the same on .NET 10 (the runtime of the Android and iOS heads, which compile the same sources);
#   3. with the rights live capture needs: root on Linux and macOS. (The Windows runner is an administrator already, so
#      its first run captures with a raw socket: Npcap isn't installed there.)
# A test that needs something a run doesn't have is reported as skipped with the reason; a skip is never a pass.
#
# Nothing is published and no secret is used. It runs on a push that touches the shared code or the tests, and by hand.

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'Helpers/**'
      - 'ViewModels/**'
      - 'Echoes.Tests/**'
      - 'Echoes.csproj'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'Helpers/**'
      - 'ViewModels/**'
      - 'Echoes.Tests/**'
      - 'Echoes.csproj'
      - '.github/workflows/tests.yml'

# Least privilege: this job only reads the repo.
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # the release's own runners (release.yml), plus the newest Ubuntu: its kernel and glibc are what most users have
        os: [ windows-latest, ubuntu-22.04, ubuntu-latest, macos-15 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # lets the tests search the runner's own network for devices (off for a developer's run: see Echoes.Tests/Support/Live.cs)
      ECHOES_TESTS_LAN: '1'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    # SDK 10 builds the net8.0 projects (as release.yml does); the .NET 8 runtime is what the tests then run on.
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Build
      run: dotnet build Echoes.Tests/Echoes.Tests.csproj -c Release

    - name: What this runner is
      shell: bash
      run: |
        dotnet --list-runtimes | grep -E 'NETCore.App (8|10)\.' || true
        uname -a || true
        if [ "$RUNNER_OS" = "Linux" ]; then sysctl net.ipv4.ping_group_range || true; ip -brief address || true; fi
        if [ "$RUNNER_OS" = "macOS" ]; then ifconfig -l || true; fi

    # The test program is started directly (it is xUnit's own runner: failures and skips are printed with their reasons).
    - name: Tests (.NET 8)
      shell: bash
      run: dotnet Echoes.Tests/bin/Release/net8.0/Echoes.Tests.dll

    - name: Tests (.NET 10)
      shell: bash
      env:
        DOTNET_ROLL_FORWARD: LatestMajor
      run: dotnet Echoes.Tests/bin/Release/net8.0/Echoes.Tests.dll

    # Root: packet sockets (Linux) and /dev/bpf (macOS) open, so the capture tests really capture; the socket tests run
    # again with a root's choices (raw ICMP, SO_BINDTODEVICE on old kernels).
    - name: Tests as root (live capture)
      if: runner.os != 'Windows'
      shell: bash
      run: sudo -E "$(command -v dotnet)" Echoes.Tests/bin/Release/net8.0/Echoes.Tests.dll
