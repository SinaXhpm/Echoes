name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev libfuse2 binutils rpm

    - name: Publish
      run: dotnet publish -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:PublishTrimmed=true -p:TrimMode=copyused -p:OptimizationPreference=Size -p:StackTraceSupport=true -p:InvariantGlobalization=false -p:DebugType=none -p:DebugSymbols=false --self-contained true -o ./publish

    - name: Package Windows
      if: matrix.os == 'windows-latest'
      run: Compress-Archive -Path ./publish/* -DestinationPath ./Echoes-Windows-x64.zip

    - name: Package Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        mkdir -p dist/Echoes.AppDir/usr/bin
        cp ./publish/Echoes dist/Echoes.AppDir/usr/bin/
        cp Assets/logo.png dist/Echoes.AppDir/Echoes.png
        printf "[Desktop Entry]\nName=Echoes\nExec=Echoes\nIcon=Echoes\nType=Application\nCategories=Utility;" > dist/Echoes.AppDir/Echoes.desktop
        ln -s usr/bin/Echoes dist/Echoes.AppDir/AppRun
        ARCH=x86_64 ./appimagetool-x86_64.AppImage dist/Echoes.AppDir Echoes-Linux-x64.AppImage
        rm appimagetool-x86_64.AppImage

        mkdir -p debian-dist/usr/bin
        cp ./publish/Echoes debian-dist/usr/bin/
        mkdir -p debian-dist/DEBIAN
        printf "Package: echoes\nVersion: 0.2.0\nArchitecture: amd64\nMaintainer: EchoesTeam\nDescription: Network Utility\n" > debian-dist/DEBIAN/control
        dpkg-deb --build debian-dist echoes.deb

        mkdir -p rpm-dist/usr/bin
        cp ./publish/Echoes rpm-dist/usr/bin/
        printf "Name: echoes\nVersion: 0.2.0\nRelease: 1\nSummary: Network Utility\nLicense: MIT\n\n%%description\nNetwork Utility\n\n%%files\n/usr/bin/Echoes\n" > echoes.spec
        rpmbuild -bb --noclean --define "_topdir $(pwd)/rpmbuild" --define "_builddir $(pwd)/rpm-dist" --define "_rpmdir $(pwd)" --buildroot $(pwd)/rpm-dist echoes.spec
        mv x86_64/*.rpm . || true

        rm appimagetool-x86_64.AppImage

    - name: Package macOS
      if: matrix.os == 'macos-latest'
      run: |
        brew install create-dmg
        mkdir -p "dist/Echoes.app/Contents/MacOS"
        mkdir -p "dist/Echoes.app/Contents/Resources"
        cp ./publish/Echoes "dist/Echoes.app/Contents/MacOS/"
        
        chmod +x "dist/Echoes.app/Contents/MacOS/Echoes"
        codesign --force --deep --sign - "dist/Echoes.app/Contents/MacOS/Echoes"
        
        cp Assets/logo.icns "dist/Echoes.app/Contents/Resources/icon.icns"
        printf '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>Echoes</string><key>CFBundleIconFile</key><string>icon.icns</string><key>CFBundleIdentifier</key><string>com.echoes.app</string><key>CFBundleName</key><string>Echoes</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>0.2.0</string></dict></plist>' > "dist/Echoes.app/Contents/Info.plist"
        
        create-dmg --volname "Echoes Installer" --window-pos 200 120 --window-size 800 400 --icon-size 100 --icon "Echoes.app" 200 190 --hide-extension "Echoes.app" --app-drop-link 600 185 "Echoes-${{ matrix.rid }}.dmg" "dist/"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Echoes-${{ matrix.rid }}
        path: |
          *.zip
          *.AppImage
          *.deb
          *.rpm
          *.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}