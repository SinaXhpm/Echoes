name: Build and Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; only the release job is granted contents:write below.
permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 8.0.x

    - name: Get Version
      id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev libfuse2 binutils rpm

    - name: Publish
      run: dotnet publish -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:PublishTrimmed=true -p:TrimMode=copyused -p:OptimizationPreference=Size -p:StackTraceSupport=true -p:DebugType=none -p:DebugSymbols=false --self-contained true -o ./publish

    - name: Package Windows
      if: matrix.os == 'windows-latest'
      run: |
        # Native debug symbols (libSkiaSharp.pdb ~80MB, libHarfBuzzSharp.pdb ~20MB) are never
        # loaded at runtime — dropping them cuts the download from ~160MB to ~60MB.
        Remove-Item ./publish/*.pdb -Force -ErrorAction SilentlyContinue
        Compress-Archive -Path ./publish/* -DestinationPath ./Echoes-Windows-x64.zip

    - name: Package Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
        # Verify the fetched tool before executing it (supply-chain guard). Update this hash when
        # intentionally bumping appimagetool — a mismatch fails the build on purpose.
        echo "b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2  /tmp/appimagetool" | sha256sum -c -
        chmod +x /tmp/appimagetool
        
        mkdir -p dist/Echoes.AppDir/usr/bin
        cp ./publish/Echoes dist/Echoes.AppDir/usr/bin/
        cp ./publish/*.so dist/Echoes.AppDir/usr/bin/ 2>/dev/null || true
        cp Assets/logo.png dist/Echoes.AppDir/Echoes.png
        printf "[Desktop Entry]\nName=Echoes\nExec=Echoes\nIcon=Echoes\nType=Application\nCategories=Utility;" > dist/Echoes.AppDir/Echoes.desktop
        ln -s usr/bin/Echoes dist/Echoes.AppDir/AppRun
        ARCH=x86_64 /tmp/appimagetool dist/Echoes.AppDir Echoes-Linux-x64.AppImage
        
        mkdir -p debian-dist/usr/bin
        cp ./publish/Echoes debian-dist/usr/bin/
        cp ./publish/*.so debian-dist/usr/bin/ 2>/dev/null || true
        mkdir -p debian-dist/DEBIAN
        printf "Package: echoes\nVersion: ${{ steps.get_version.outputs.VERSION }}\nArchitecture: amd64\nMaintainer: EchoesTeam\nDescription: Network Utility\n" > debian-dist/DEBIAN/control
        dpkg-deb --build debian-dist echoes.deb

        mkdir -p rpm-dist/usr/bin
        cp ./publish/Echoes rpm-dist/usr/bin/
        cp ./publish/*.so rpm-dist/usr/bin/ 2>/dev/null || true
        printf "Name: echoes\nVersion: ${{ steps.get_version.outputs.VERSION }}\nRelease: 1\nSummary: Network Utility\nLicense: MIT\n\n%%description\nNetwork Utility\n\n%%files\n/usr/bin/*\n" > echoes.spec
        rpmbuild -bb --noclean --define "_topdir $(pwd)/rpmbuild" --define "_builddir $(pwd)/rpm-dist" --define "_rpmdir $(pwd)" --buildroot $(pwd)/rpm-dist echoes.spec
        find . -name "*.rpm" -exec mv {} . \;
        rm -f /tmp/appimagetool

    - name: Package macOS
      if: matrix.os == 'macos-latest'
      run: |
        brew install create-dmg
        mkdir -p "dist/Echoes.app/Contents/MacOS"
        mkdir -p "dist/Echoes.app/Contents/Resources"
        
        cp ./publish/Echoes "dist/Echoes.app/Contents/MacOS/"
        cp ./publish/*.dylib "dist/Echoes.app/Contents/MacOS/" 2>/dev/null || true
        
        chmod +x "dist/Echoes.app/Contents/MacOS/Echoes"
        cp Assets/logo.icns "dist/Echoes.app/Contents/Resources/icon.icns"
        
        printf '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>Echoes</string><key>CFBundleIconFile</key><string>icon.icns</string><key>CFBundleIdentifier</key><string>com.echoes.app</string><key>CFBundleName</key><string>Echoes</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>${{ steps.get_version.outputs.VERSION }}</string><key>LSMinimumSystemVersion</key><string>10.15</string></dict></plist>' > "dist/Echoes.app/Contents/Info.plist"
        
        printf '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>com.apple.security.network.client</key><true/><key>com.apple.security.network.server</key><true/><key>com.apple.security.cs.allow-jit</key><true/><key>com.apple.security.cs.disable-library-validation</key><true/></dict></plist>' > entitlements.plist
        
        codesign --force --options runtime --entitlements entitlements.plist --deep --sign - "dist/Echoes.app"

        mkdir -p dmg_prepare
        cp -R "dist/Echoes.app" dmg_prepare/
        ln -s /Applications dmg_prepare/Applications

        hdiutil create -volname "Echoes Installer" -srcfolder dmg_prepare -ov -format UDZO "Echoes-${{ matrix.rid }}.dmg"

    - name: Upload Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: Echoes-${{ matrix.rid }}
        path: |
          *.zip
          Echoes-Linux-x64.AppImage
          *.deb
          *.rpm
          *.dmg

  android:
    runs-on: ubuntu-latest
    # Experimental head — never block the desktop release if the APK build fails.
    continue-on-error: true
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 10.0.x

    - name: Setup JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android workload
      run: dotnet workload install android

    - name: Decode release keystore
      run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/echoes-release.keystore"

    # Release config, signed with the production keystore (from repo secrets).
    # Signing passwords are passed via env (MSBuild imports env vars as properties) rather than
    # -p: on the command line, so they never land in argv / a binlog. Display version comes from the tag.
    - name: Build APK (Release, signed)
      env:
        AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        AndroidSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
        AndroidSigningKeyPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: >
        dotnet build Echoes.Android/Echoes.Android.csproj -c Release -f net10.0-android
        -p:AndroidKeyStore=true
        -p:AndroidSigningKeyStore="$RUNNER_TEMP/echoes-release.keystore"
        -p:ApplicationDisplayVersion=${GITHUB_REF_NAME#v}

    - name: Collect APK
      run: |
        APK=$(find . -name "*-Signed.apk" | head -n 1)
        if [ -z "$APK" ]; then APK=$(find . -name "*.apk" | head -n 1); fi
        echo "Found APK: $APK"
        cp "$APK" Echoes-Android.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: Echoes-Android
        path: Echoes-Android.apk
        if-no-files-found: error

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release / upload assets
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: ./artifacts/**/*
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}