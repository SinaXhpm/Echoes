name: macOS App Store (sandbox test and package)

# The Mac App Store build of Echoes (docs/apple/README.md, "Mac App Store"): the Native AOT app published with
# -p:StoreBuild=true for arm64 and x64, joined into one universal app. It runs by hand only and does two things:
#
#   1. a SANDBOX TEST, always: a copy signed ad hoc with the store's entitlements (App Sandbox) is started with
#      ECHOES_STORE_SELFTEST=1. It checks what the sandbox could break (data folder, Downloads, sockets, child processes, the
#      single-instance socket), opens its window and exits; the step fails if one check fails.
#   2. the SIGNED PACKAGE, when the signing secrets are there: the app signed with Apple Distribution and the Mac App Store
#      profile, wrapped by productbuild and signed with Mac Installer Distribution, validated by Apple; and uploaded to App
#      Store Connect (TestFlight for the Mac) when "upload" is ticked.
#
# Secrets: IOS_CERT_P12_BASE64 + IOS_CERT_PASSWORD (Apple Distribution, as iOS), MACINSTALLER_CERT_P12_BASE64 +
# MACINSTALLER_CERT_PASSWORD (Mac Installer Distribution), MAC_PROFILE_BASE64 (the Mac App Store provisioning profile),
# APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER (validate and upload).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed package to App Store Connect (the Mac TestFlight)
        type: boolean
        default: false
      runner:
        description: Runner image (the macOS and Xcode the app is linked with)
        type: string
        default: macos-15

# Least privilege: this job only reads the repo and uploads a workflow artifact.
permissions:
  contents: read

jobs:
  appstore:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 10.0.x

    - name: Versions
      id: ver
      run: |
        short="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Echoes.csproj | head -n 1)"
        echo "SHORT=$short" >> "$GITHUB_OUTPUT"
        echo "BUILD=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        echo "Version $short, build ${{ github.run_number }}"
        xcodebuild -version
        xcrun --show-sdk-version

    # the same publish command as release.yml, plus the store switch (STORE: no update check, no login item)
    - name: Publish (arm64 and x64)
      env:
        MACOSX_DEPLOYMENT_TARGET: '12.0'
      run: |
        for rid in osx-arm64 osx-x64; do
          dotnet publish Echoes.csproj -c Release -r "$rid" -p:Version=${{ steps.ver.outputs.SHORT }} -p:StoreBuild=true -p:PublishAot=true -p:PublishTrimmed=true -p:TrimMode=copyused -p:OptimizationPreference=Size -p:StackTraceSupport=true -p:DebugType=none -p:DebugSymbols=false --self-contained true -o "./publish-${rid#osx-}"
        done

    - name: Import the signing identities and the profile
      env:
        IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
        IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        MACINSTALLER_CERT_P12_BASE64: ${{ secrets.MACINSTALLER_CERT_P12_BASE64 }}
        MACINSTALLER_CERT_PASSWORD: ${{ secrets.MACINSTALLER_CERT_PASSWORD }}
        MAC_PROFILE_BASE64: ${{ secrets.MAC_PROFILE_BASE64 }}
      run: bash packaging/macos/import-appstore-signing.sh

    - name: Package
      run: bash packaging/macos/package-appstore.sh "${{ steps.ver.outputs.SHORT }}" "${{ steps.ver.outputs.BUILD }}"

    # What the App Sandbox does to the app. The app prints one "STORETEST" line per check; a crash before the first line means
    # the sandbox or the signature stopped it, and the system log below says why.
    - name: Sandbox test
      run: |
        app="dist-appstore/test/Echoes.app"
        log="$RUNNER_TEMP/storetest.log"
        : > "$log"
        ECHOES_STORE_SELFTEST=1 "$app/Contents/MacOS/Echoes" > "$log" 2>&1 &
        pid=$!
        for i in $(seq 1 90); do
          if grep -q "STORETEST DONE" "$log" 2>/dev/null; then break; fi
          if ! kill -0 "$pid" 2>/dev/null; then break; fi
          sleep 2
        done
        kill "$pid" 2>/dev/null || true
        echo "---- what the app printed"
        cat "$log"
        echo "----"
        if ! grep -q "STORETEST DONE failures=0" "$log"; then
          echo "---- the sandbox's own messages (last 3 minutes)"
          log show --last 3m --style compact --predicate '(eventMessage CONTAINS "Sandbox" OR eventMessage CONTAINS "deny(") AND eventMessage CONTAINS "Echoes"' 2>/dev/null | tail -40 || true
          echo "---- crash reports"
          ls -t "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | grep -i echoes | head -3 || true
          for r in $(ls -t "$HOME"/Library/Logs/DiagnosticReports/*Echoes* 2>/dev/null | head -1); do head -60 "$r"; done
          echo "::error::The sandbox test did not finish with failures=0 (see the lines above)."
          exit 1
        fi
        echo "The sandbox test passed."

    - name: Check the signed package
      if: ${{ env.APPSTORE_INSTALLER_IDENTITY != '' }}
      run: |
        pkgutil --check-signature Echoes-AppStore.pkg | sed -E 's/^( *[0-9]+\. ).*/\1<signer>/' | head -8
        ls -la Echoes-AppStore.pkg

    - name: Validate (and upload) with Apple
      if: ${{ env.APPSTORE_INSTALLER_IDENTITY != '' }}
      env:
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      run: |
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        key="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
        printf '%s\n' "$APPLE_API_KEY_P8" > "$key"; chmod 600 "$key"
        xcrun altool --validate-app -f Echoes-AppStore.pkg -t macos --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
        if [ "${{ inputs.upload }}" = "true" ]; then
          xcrun altool --upload-app -f Echoes-AppStore.pkg -t macos --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          echo "Uploaded. Apple processes the build for a few minutes, then it appears in App Store Connect > TestFlight (macOS)."
        else
          echo "Validated only (tick 'upload' to send it)."
        fi
        rm -f "$key"

    # the signed package (it installs only through TestFlight / the Mac App Store), e.g. for a release's files
    - name: Keep the package (7 days)
      if: ${{ env.APPSTORE_INSTALLER_IDENTITY != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: Echoes-macOS-AppStore
        path: Echoes-AppStore.pkg
        retention-days: 7
        if-no-files-found: error

    - name: Keep the sandbox test log (7 days)
      if: always()
      run: cp "$RUNNER_TEMP/storetest.log" storetest.log 2>/dev/null || true

    - name: Upload the log
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: Echoes-mac-store-test
        path: storetest.log
        retention-days: 7
        if-no-files-found: ignore

    - name: Remove the signing keychain
      if: always()
      run: |
        if [ -n "${APPSTORE_KEYCHAIN:-}" ]; then security delete-keychain "$APPSTORE_KEYCHAIN" || true; fi
        rm -f "$RUNNER_TEMP/echoes-mac.provisionprofile"
